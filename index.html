<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora da Geovanna</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav id="corpo">
        <h1>Calculadora</h1>
        <input type="text" id="visor">

        <div class="teclado">
            <button class="operador" data-acao="limpar">C</button>
            <button class="operador" data-acao="apagar">
                <img src="https://images.icon-icons.com/1875/PNG/96/delete_120224.png" alt="apagar">
            </button>
            <button class="operador" data-val="/">%</button>
            <button class="operador" data-val="/">÷</button>

            <button class="n" data-val="7">7</button>
            <button class="n" data-val="8">8</button>
            <button class="n" data-val="9">9</button>
            <button class="operador" data-val="*">x</button>

            <button class="n" data-val="4">4</button>
            <button class="n" data-val="5">5</button>
            <button class="n" data-val="6">6</button>
            <button class="operador" data-val="-">-</button>

            <button class="n" data-val="1">1</button>
            <button class="n" data-val="2">2</button>
            <button class="n" data-val="3">3</button>
            <button class="soma" data-val="+">+</button>

            <button class="n" data-val="0">0</button>
            <button class="igual" data-acao="calcular">=</button>
        </div>

    </nav>

    <script src="js/script.js"></script>
</body>
</html>
